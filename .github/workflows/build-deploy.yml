name: Build and Deploy CV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Full TeX Live with LuaLaTeX, so the cv-dsl plugin compiles the PDF and
    # verifies its layout rules (page limit, page fits) exactly as locally.
    container: texlive/texlive:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check, generate and verify the CV, assemble the site
        run: ./gradlew --no-daemon check assembleSite

      - name: Upload PDF layout report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cv-layout
          path: |
            build/cv.pdf
            build/cv-layout.txt
            build/lualatex.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: build/site/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: build/site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/site
